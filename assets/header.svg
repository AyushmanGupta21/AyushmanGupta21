<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      
      .text {
        font-family: 'Outfit', sans-serif;
        font-size: 85px;
        font-weight: 800;
        text-transform: uppercase;
        text-anchor: middle;
        letter-spacing: 2px;
      }

      .text-bg {
        fill: none;
        stroke: #0F172A;
        stroke-width: 8px;
        stroke-linejoin: round;
        transform: translate(6px, 6px);
        opacity: 0.8;
      }

      .text-glow {
        fill: none;
        stroke: url(#glow-grad);
        stroke-width: 16px;
        filter: blur(12px);
        opacity: 0.8;
        transform: translate(2px, 2px);
      }

      .text-main {
        fill: url(#text-grad);
      }
    </style>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #818CF8; #0EA5E9; #38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="33%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8; #A855F7; #38BDF8; #818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="66%" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E; #06B6D4; #818CF8; #22C55E" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #22C55E; #A855F7; #38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <g transform="translate(500, 105)">
    <text x="0" y="0" class="text text-glow">AYUSHMAN GUPTA</text>
    <text x="0" y="0" class="text text-bg">AYUSHMAN GUPTA</text>
    <text x="0" y="0" class="text text-main">AYUSHMAN GUPTA</text>
  </g>
</svg>
