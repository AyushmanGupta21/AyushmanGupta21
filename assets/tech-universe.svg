<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
      
      .bg { fill: transparent; }
      
      .card-bg {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 2;
        rx: 15;
      }
      
      .title {
        font-family: 'Fira Code', monospace;
        font-size: 28px;
        font-weight: bold;
        text-anchor: middle;
        fill: #38BDF8;
      }
      
      .card-title {
        font-family: 'Fira Code', monospace;
        font-size: 22px;
        font-weight: bold;
        text-anchor: middle;
      }
      
      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        text-anchor: middle;
        fill: #8b949e;
      }
      
      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      .anim-float { animation: float 4s ease-in-out infinite; }
      .anim-pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    </style>
    
    <linearGradient id="grad-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="grad-web3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="450" y="50" class="title">🎯 WHAT I DO 🌌</text>

  <!-- COLUMN 1: FULL STACK & PRODUCT (Blue Theme) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="250" height="250" class="card-bg" style="stroke: #38BDF8;" />
    <rect x="0" y="0" width="250" height="250" rx="15" fill="url(#grad-dev)" />
    
    <g transform="translate(125, 100)">
      <g class="anim-float">
        <!-- React/Full Stack abstract icon -->
        <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#38BDF8" stroke-width="4" transform="rotate(30)" />
        <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#38BDF8" stroke-width="4" transform="rotate(90)" />
        <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#38BDF8" stroke-width="4" transform="rotate(150)" />
        <circle cx="0" cy="0" r="8" fill="#FACC15" />
      </g>
    </g>
    
    <text x="125" y="200" class="card-title" style="fill: #38BDF8;">FULL STACK</text>
    <text x="125" y="225" class="subtitle">Product Engineering</text>
  </g>
  
  <!-- COLUMN 2: AI SYSTEMS (Green Theme) -->
  <g transform="translate(325, 100)">
    <rect x="0" y="0" width="250" height="250" class="card-bg" style="stroke: #22C55E;" />
    <rect x="0" y="0" width="250" height="250" rx="15" fill="url(#grad-ai)" />
    
    <g transform="translate(125, 100)">
      <g class="anim-pulse">
         <!-- Neural Network Node Graphic -->
         <circle cx="-30" cy="-20" r="8" fill="#22C55E" />
         <circle cx="30" cy="-20" r="8" fill="#22C55E" />
         <circle cx="-30" cy="20" r="8" fill="#22C55E" />
         <circle cx="30" cy="20" r="8" fill="#22C55E" />
         <circle cx="0" cy="0" r="12" fill="#22C55E" />
         
         <line x1="-30" y1="-20" x2="0" y2="0" stroke="#22C55E" stroke-width="2" />
         <line x1="30" y1="-20" x2="0" y2="0" stroke="#22C55E" stroke-width="2" />
         <line x1="-30" y1="20" x2="0" y2="0" stroke="#22C55E" stroke-width="2" />
         <line x1="30" y1="20" x2="0" y2="0" stroke="#22C55E" stroke-width="2" />
      </g>
    </g>
    
    <text x="125" y="200" class="card-title" style="fill: #22C55E;">AI &amp; ML</text>
    <text x="125" y="225" class="subtitle">Intelligent Systems</text>
  </g>
  
  <!-- COLUMN 3: WEB3 BLOCKCHAIN (Purple Theme) -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="250" height="250" class="card-bg" style="stroke: #9333EA;" />
    <rect x="0" y="0" width="250" height="250" rx="15" fill="url(#grad-web3)" />
    
    <g transform="translate(125, 100)">
      <g class="anim-float" style="animation-delay: 2s;">
        <!-- Blockchain/Decentralized Node Graphic -->
        <polygon points="0,-40 34,-20 34,20 0,40 -34,20 -34,-20" fill="none" stroke="#9333EA" stroke-width="3" />
        <circle cx="0" cy="-40" r="5" fill="#D8B4FE"/>
        <circle cx="34" cy="-20" r="5" fill="#D8B4FE"/>
        <circle cx="34" cy="20" r="5" fill="#D8B4FE"/>
        <circle cx="0" cy="40" r="5" fill="#D8B4FE"/>
        <circle cx="-34" cy="20" r="5" fill="#D8B4FE"/>
        <circle cx="-34" cy="-20" r="5" fill="#D8B4FE"/>

        <!-- Inner connections -->
        <line x1="0" y1="-40" x2="0" y2="0" stroke="#9333EA" stroke-width="2"/>
        <line x1="34" y1="-20" x2="0" y2="0" stroke="#9333EA" stroke-width="2"/>
        <line x1="-34" y1="20" x2="0" y2="0" stroke="#9333EA" stroke-width="2"/>
        
        <circle cx="0" cy="0" r="8" fill="#9333EA"/>
      </g>
    </g>
    
    <text x="125" y="200" class="card-title" style="fill: #9333EA; font-size: 20px;">WEB3 ARCHITECTURE</text>
    <text x="125" y="225" class="subtitle">Blockchain &amp; DApps</text>
  </g>
</svg>
